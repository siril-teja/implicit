# Throwaway: Direct3D compile time of scene variants (branch d3d-probe only; never merged).
name: D3D probe
on:
  push:
    branches: [d3d-probe]
jobs:
  probe:
    runs-on: windows-2025
    timeout-minutes: 170
    steps:
      - uses: actions/checkout@v4.2.2
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5.6.0
        with:
          python-version: "3.13.17"
      - uses: actions/setup-node@v4.4.0
        with:
          node-version: "22.22.0"
      - run: python -m pip install pip==24.0 && python -m pip install -r requirements.txt
      - name: Build
        shell: bash
        run: |
          python probe/variants.py examples
          python -m implicit.build examples/v_*.json --out site
          git worktree add ../main origin/main
          (cd ../main && python -m implicit.build examples/average_spine.json --out ../site_main)
      - name: Playwright
        shell: bash
        run: cd ci && npm ci --ignore-scripts && npx playwright install chromium
      - name: Probe main
        shell: bash
        run: node ci/compile_probe.mjs ../site_main d3d11 average_spine
      - name: Probe variants
        shell: bash
        run: node ci/compile_probe.mjs site d3d11 v_nodiscs v_full v_restlm v_rawbones v_annulus
