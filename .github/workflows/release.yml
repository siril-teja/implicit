name: Release

# main only changes through merged PRs. Each merge with a new version in
# implicit/__init__.py creates tag vX.Y.Z, a GitHub release (notes from
# CHANGELOG.md, built viewer attached) and deploys the viewer to GitHub Pages.
on:
  push:
    branches: [main]
  workflow_dispatch:  # redeploy the current release

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      release: ${{ steps.v.outputs.release }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Tests
        run: python -m unittest discover -s tests -v
      - name: Version
        id: v
        run: |
          v=$(python ci/release.py version)
          echo "version=$v" >> "$GITHUB_OUTPUT"
          if git rev-parse -q --verify "refs/tags/v$v" >/dev/null; then
            echo "release=false" >> "$GITHUB_OUTPUT"
            echo "v$v is already released; nothing to publish"
          else
            echo "release=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Build viewer
        run: |
          python -m implicit.build examples/*.json examples/*.py --out site --commit "$GITHUB_SHA" --repo "$GITHUB_REPOSITORY"
          cp NOTICE.md CHANGELOG.md site/
      - name: Create release
        if: steps.v.outputs.release == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          v=${{ steps.v.outputs.version }}
          python ci/release.py notes "$v" > notes.md
          (cd site && zip -qr "../implicit-viewer-v$v.zip" .)
          gh release create "v$v" "implicit-viewer-v$v.zip" \
            --target "$GITHUB_SHA" --title "v$v" --notes-file notes.md
      - uses: actions/upload-pages-artifact@v3
        if: steps.v.outputs.release == 'true' || github.event_name == 'workflow_dispatch'
        with:
          path: site

  deploy:
    needs: build
    if: needs.build.outputs.release == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
