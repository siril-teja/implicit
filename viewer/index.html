<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Implicit Spine Viewer</title>
<style>
  :root {
    --bg: #1d1f24; --panel: #25282f; --text: #e6e8ec; --muted: #9aa0ab;
    --accent: #6aa9ff; --border: #343843; --err: #ff8080; --btn: #30343d;
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text);
    font: 13px/1.35 system-ui, -apple-system, "Segoe UI", sans-serif; }
  #app { display: flex; flex-direction: column; height: 100%; }
  #stage { position: relative; flex: 1; min-height: 120px; }
  #gl { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; cursor: grab; }
  #hud { position: absolute; left: 10px; top: 8px; right: 10px; display: flex; gap: 8px; align-items: center;
    pointer-events: none; flex-wrap: wrap; }
  #hud > * { pointer-events: auto; }
  #hud #title { font-weight: 600; text-shadow: 0 1px 3px #000; pointer-events: none; }
  #hud #fps { color: var(--text); font-size: 12px; font-variant-numeric: tabular-nums; pointer-events: none;
    background: #0008; border-radius: 5px; padding: 3px 8px; }
  #hud #fps:empty { display: none; }
  #clearance .clr { display: flex; justify-content: space-between; font-size: 12px; padding: 1px 0;
    font-variant-numeric: tabular-nums; color: var(--muted); }
  #clearance .clr.hit { color: var(--err); font-weight: 600; }
  #hud #legend { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--text);
    background: #0008; border-radius: 5px; padding: 3px 8px; pointer-events: none; }
  #hud #legend[hidden] { display: none; }
  #hud #legend .bar { width: 120px; height: 10px; border-radius: 2px;
    background: linear-gradient(90deg, #440154, #3b528b, #21918c, #5ec962, #fde725); }
  #hud #fps.mid { color: #ffd27a; } #hud #fps.slow { color: var(--err); }
  #hud .spacer { flex: 1; pointer-events: none; }
  #dock { flex: none; height: var(--dock-h, 42vh); display: flex; flex-direction: column;
    background: var(--panel); border-top: 1px solid var(--border); min-height: 0; }
  #dock[hidden] { display: none; }
  #grip { height: 6px; margin-top: -3px; cursor: ns-resize; flex: none; }
  #grip:hover { background: var(--accent); opacity: .5; }
  #dockBar { display: flex; gap: 6px; align-items: center; padding: 2px 10px 6px; flex: none; flex-wrap: wrap; }
  #dockBar .note { color: var(--muted); font-size: 12px; margin-left: 6px; }
  #dockBody { flex: 1; display: flex; min-height: 0; }
  #editorWrap { flex: 1; position: relative; min-width: 0; border-top: 1px solid var(--border);
    background: #1a1c21 radial-gradient(#2a2e37 1px, transparent 1px) 0 0 / 22px 22px; overflow: hidden; }
  #editor { width: 100%; height: 100%; display: block; touch-action: none; user-select: none; }
  #noGraph { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
    color: var(--muted); padding: 20px; text-align: center; }
  #noGraph[hidden] { display: none; }
  #side { width: 330px; flex: none; display: flex; flex-direction: column; border-left: 1px solid var(--border);
    border-top: 1px solid var(--border); min-height: 0; }
  .tabs { display: flex; flex: none; }
  .tabs button { flex: 1; border-radius: 0; border: 0; border-bottom: 2px solid transparent; background: none; color: var(--muted); }
  .tabs button.on { color: var(--text); border-bottom-color: var(--accent); }
  .pane { flex: 1; overflow-y: auto; padding: 10px 14px 30px; }
  .pane[hidden] { display: none; }
  h1 { font-size: 15px; margin: 0 0 4px; }
  h2 { font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted);
    margin: 18px 0 8px; font-weight: 600; }
  .param { margin-bottom: 9px; }
  .param label { display: block; color: var(--muted); margin-bottom: 2px; }
  .param.sub { margin: 0 0 3px 12px; }
  .param.sub label { display: inline; margin-right: 4px; }
  .param.sub .row { display: inline-flex; width: calc(100% - 20px); }
  .row { display: flex; align-items: center; gap: 6px; }
  .row input[type=range] { flex: 1; min-width: 0; accent-color: var(--accent); }
  input.num { width: 64px; }
  input[type=number], input[type=text], input[type=search], .ntitle { background: var(--btn); color: var(--text);
    border: 1px solid var(--border); border-radius: 5px; padding: 3px 6px; font: inherit; }
  output { width: 44px; text-align: right; font-variant-numeric: tabular-nums; }
  button, select { background: var(--btn); color: var(--text); border: 1px solid var(--border);
    border-radius: 5px; padding: 5px 9px; font: inherit; cursor: pointer; }
  button:hover { border-color: var(--accent); }
  button:disabled { opacity: .45; cursor: default; }
  button.reset { padding: 1px 6px; color: var(--muted); }
  .body { display: flex; align-items: center; gap: 7px; margin: 4px 0; cursor: pointer; }
  .swatch { width: 12px; height: 12px; border-radius: 3px; display: inline-block; }
  .buttons { display: flex; flex-wrap: wrap; gap: 6px; }
  #status { white-space: pre-wrap; color: var(--muted); margin-top: 10px; font-size: 12px; }
  #status.err { color: var(--err); font-family: ui-monospace, monospace; }
  .hint { color: var(--muted); font-size: 11px; margin-top: 6px; }
  .hint a { color: var(--accent); }
  .nsec { border: 1px solid var(--border); border-radius: 6px; padding: 8px 10px; margin: 10px 0; }
  .nhead { display: flex; align-items: center; gap: 6px; }
  .ntitle { flex: 1; min-width: 0; font-weight: 600; }
  .nblk { color: var(--muted); font-size: 11px; }
  .nerr { color: var(--err); font-size: 12px; margin-top: 6px; }
  .wired { color: var(--accent); }
  /* canvas */
  .node .box { fill: #2b2f38; stroke: #3d4250; stroke-width: 1; }
  .node.sel .box { stroke: var(--accent); stroke-width: 2; }
  .node.hl .box { stroke: #7fb3ff; stroke-width: 2; stroke-dasharray: 4 3; }
  .node.err .box { stroke: var(--err); stroke-width: 2; }
  .node .head, .node .head-fill { fill: #3a3f4b; }
  .node .cat-inputs { fill: #3d4a5c; } .node .cat-shapes { fill: #4a3d5c; } .node .cat-booleans { fill: #5c4a3d; }
  .node .cat-transforms { fill: #3d5c52; } .node .cat-modify { fill: #5c553d; } .node .cat-output { fill: #3d5c3f; }
  .node .cat-anatomy { fill: #5c3d47; } .node .cat-planes-frames { fill: #5c4a5a; }
  .node text { fill: var(--text); font-size: 12px; pointer-events: none; }
  .node .title { font-weight: 600; }
  .node .blk, .node .dim { fill: var(--muted); font-size: 11px; }
  .node .port { font-size: 11.5px; }
  .node { cursor: move; }
  .sock { stroke: #15171b; stroke-width: 1.5; cursor: crosshair; }
  .sock:hover { stroke: #fff; }
  .wire { stroke-width: 2.2; fill: none; opacity: .85; }
  .wire.temp { stroke-dasharray: 5 4; }
  .palette { position: absolute; width: 260px; max-height: 320px; display: flex; flex-direction: column;
    background: var(--panel); border: 1px solid var(--border); border-radius: 8px; box-shadow: 0 6px 24px #0008; z-index: 5; }
  .pal-search { margin: 8px; }
  .pal-list { overflow-y: auto; padding: 0 6px 8px; }
  .pal-cat { color: var(--muted); font-size: 10.5px; text-transform: uppercase; letter-spacing: .06em; margin: 8px 4px 3px; }
  .pal-item { display: block; width: 100%; text-align: left; border: 0; background: none; padding: 4px 6px; }
  .pal-item:hover { background: var(--btn); }
  .pal-item span { display: block; color: var(--muted); font-size: 11px; }
  @media (max-width: 720px) {
    #dockBody { flex-direction: column; }
    #side { width: 100%; border-left: 0; flex: 1; }
    #editorWrap { flex: 1; }
  }
</style>
</head>
<body>
<div id="app">
  <div id="stage">
    <canvas id="gl"></canvas>
    <div id="hud">
      <span id="title">Loading…</span>
      <select id="scenePick" hidden></select>
      <span class="spacer"></span>
      <span id="fps" title="Frames per second while the view moves; then the time to draw the sharp image"></span>
      <div id="legend" hidden title="Colour of a field display: displacement of the tissue by the alignment">
        <span>0</span><span class="bar"></span><span id="legendMax"></span></div>
      <button id="dockToggle" title="Show or hide the panel (Tab)">Hide panel</button>
    </div>
  </div>
  <div id="dock">
    <div id="grip" title="Drag to resize"></div>
    <div id="dockBar">
      <button id="gAdd" title="Add a block (or double-click the canvas)">+ Block</button>
      <button id="gUndo" title="Undo (Ctrl+Z)">Undo</button>
      <button id="gRedo" title="Redo (Ctrl+Shift+Z)">Redo</button>
      <button id="gFit" title="Fit all blocks in view">Fit</button>
      <button id="gOpen" title="Open a graph file (.json)">Open…</button>
      <button id="gDownload" title="Download this graph as a file">Download</button>
      <button id="gSave" title="Save to the scene file on disk (dev server)" hidden>Save</button>
      <button id="gReset" title="Discard your edits and reload the published graph">Reset</button>
      <span class="note" id="graphNote"></span>
      <input type="file" id="gFile" accept=".json,application/json" hidden>
    </div>
    <div id="dockBody">
      <div id="editorWrap">
        <svg id="editor"></svg>
        <div id="noGraph" hidden>This scene is a Python script, so it has no blocks to edit.
          Its sliders are in the Scene tab.</div>
      </div>
      <div id="side">
        <div class="tabs"><button data-tab="sel" class="on">Selection</button><button data-tab="scene">Scene</button></div>
        <div class="pane" id="selPane"></div>
        <div class="pane" id="scenePane" hidden>
          <h2 id="paramsHead">Parameters</h2>
          <div id="params"></div>
          <h2 id="clearHead" hidden title="Smallest gap between neighbouring bones; negative: they overlap">Clearance</h2>
          <div id="clearance"></div>
          <h2>Show</h2>
          <div id="bodies"></div>
          <h2>Section</h2>
          <label class="body"><input type="checkbox" id="clipOn"> Section cut</label>
          <div class="row">
            <select id="clipAxis">
              <option value="0">Sagittal (x)</option>
              <option value="1">Coronal (y)</option>
              <option value="2">Axial (z)</option>
            </select>
            <label class="body"><input type="checkbox" id="clipFlip"> flip</label>
          </div>
          <div class="row" style="margin-top:6px"><input type="range" id="clipOffset"></div>
          <h2>View</h2>
          <div class="buttons">
            <button id="resetView">Reset view</button>
            <select id="quality" title="Pixel density of the sharp image (high-DPI screens)">
              <option value="high">Quality: high</option>
              <option value="balanced">Quality: balanced</option>
              <option value="fast">Quality: fast</option>
            </select>
            <button id="copyParams">Copy params</button>
            <button id="exportStl" hidden>Export STL</button>
          </div>
          <div class="hint">Drag: orbit · Shift/right-drag: pan · Wheel: zoom · Click: select a body · Tab: hide/show this panel</div>
          <div id="status"></div>
          <h2>About</h2>
          <div id="about" class="hint"></div>
          <div id="diag" class="hint"></div>
          <div id="attribution" class="hint"></div>
        </div>
      </div>
    </div>
  </div>
</div>
<!--APP-->
<!--SCENES-->
<script src="gpu.js"></script>
<script src="solvers.js"></script>
<script src="graph.js"></script>
<script src="clearance.js"></script>
<script src="editor.js"></script>
<script src="viewer.js"></script>
</body>
</html>
